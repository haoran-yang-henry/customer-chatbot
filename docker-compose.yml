services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent  # local development only
      POSTGRES_DB: customer_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d customer_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin  # local development only
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl; probe the management port with bash's /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  # The API as a container (Day 7): `make up-app`. Settings come from .env; the database and
  # the JWKS endpoint are reached by service name, the token issuer stays localhost:8080.
  app:
    build: .
    profiles: [app]
    env_file:
      - path: .env
        required: false
    environment:
      CA_APP_ENV: local
      CA_DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/customer_agent
      CA_AUTH_JWKS_URL: http://keycloak:8080/realms/nordelektro/protocol/openid-connect/certs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # Traces UI (Day 7): `make up-observability`, then CA_OTEL_ENDPOINT=http://localhost:4318.
  # Not started by `make up`; in-memory storage, local development only.
  jaeger:
    image: jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
    profiles: [observability]
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP/HTTP receiver

volumes:
  pgdata:
