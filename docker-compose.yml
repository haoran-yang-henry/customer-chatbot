services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent  # local development only
      POSTGRES_DB: customer_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d customer_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
