# Browser demo overlay, used only by infra/demo/public.sh:
#   docker compose -f docker-compose.yml -f infra/demo/compose.yml --profile app --profile demo …
# DEMO_URL is the tunnel's public address; the script sets it once the tunnel is up.
services:
  tunnel:
    # Cloudflare quick tunnel: no account, a new random https://*.trycloudflare.com per start.
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    profiles: [demo]
    command: ["tunnel", "--no-autoupdate", "--url", "http://proxy:80"]

  proxy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    profiles: [demo]
    volumes:
      - ./infra/demo/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  keycloak:
    environment:
      # Tokens and login pages use the public address; the API expects it as the issuer.
      KC_HOSTNAME: ${DEMO_URL:-http://localhost:8080}
      KC_PROXY_HEADERS: xforwarded

  app:
    environment:
      CA_AUTH_ISSUER: ${DEMO_URL:-http://localhost:8080}/realms/nordelektro
      CA_AUTH_REQUIRED: "true"  # every message costs model calls: logged-in demo users only
      CA_CORS_ORIGINS: https://haoran-yang-henry.github.io,http://localhost:3000
      CA_RATE_LIMIT_PER_MINUTE: "10"
      CA_LOG_FORMAT: json
