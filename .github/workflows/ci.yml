name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: no job writes to the repository (Day 6 hardening).
permissions:
  contents: read

# Actions are pinned to commit SHAs (tags can be moved by whoever controls the action
# repository); the comment names the release. Container images are pinned by digest.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Unit and data tests
        run: uv run pytest --cov -m "not integration and not llm"
      - name: Integration tests (Testcontainers, Docker is preinstalled on the runner)
        run: uv run pytest -m integration
      - name: Evaluation harness smoke test (placeholder agent; real-agent gate on Day 8)
        run: |
          uv run customer-agent-eval --dataset eval/datasets/core.jsonl --day 1 --out eval-result.json
          uv run customer-agent-eval --dataset eval/datasets/redteam.jsonl --day 1 --out redteam-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-result
          path: |
            eval-result.json
            redteam-result.json

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # gitleaks scans the whole history, not just the last commit
          persist-credentials: false
      - name: Secrets in git history (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner
      - name: Vulnerabilities, secrets and misconfigurations in the tree (Trivy)
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1
          --skip-version-check /repo
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Known vulnerabilities in locked dependencies (pip-audit)
        run: |
          uv export --locked --format requirements-txt --no-emit-project --all-groups -o requirements-audit.txt
          uvx --from pip-audit==2.10.1 pip-audit -r requirements-audit.txt --require-hashes --disable-pip

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the API image
        run: docker build -t customer-agent:ci .
      - name: Vulnerabilities in the image (Trivy; unfixed base-image issues do not fail)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --skip-version-check
          customer-agent:ci
      - name: The image starts and answers its liveness probe
        run: |
          docker run -d --name api -p 8000:8000 \
            -e CA_OPENAI_API_KEY=dummy -e CA_LLM_API_KEY=dummy customer-agent:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/health/live && exit 0
            sleep 1
          done
          docker logs api
          exit 1
