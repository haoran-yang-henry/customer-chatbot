[project]
name = "customer-agent"
version = "0.1.0"
description = "German-language customer service agent: governed RAG, explicit workflows, guardrails."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "openai>=1.60",
    "pyjwt[crypto]>=2.10",
    "structlog>=26.1.0",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "prometheus-client>=0.26.0",
    "langfuse>=5.0.4",
    "langchain>=1.4.7",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "starlette>=1.7.0",
    "psycopg-pool>=3.3.3",
]

[project.scripts]
customer-agent-eval = "customer_agent.evaluation.cli:main"
customer-agent-eval-retrieval = "customer_agent.evaluation.retrieval_cli:main"
customer-agent-ingest = "customer_agent.cli.ingest:main"
customer-agent-search = "customer_agent.cli.search:main"
customer-agent-token = "customer_agent.cli.token:main"
customer-agent-seed = "customer_agent.cli.seed:main"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "httpx2>=2.13.1",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.9",
    "types-PyYAML>=6.0",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # bugbear
    "SIM",     # simplify
    "S",       # bandit (security)
    "RUF",     # ruff-specific
]

# German typography in customer-facing text (LR-04): dash and multiplication sign are intended.
allowed-confusables = ["–", "×"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake test credentials

[tool.deptry.per_rule_ignores]
# Used without an import: the server command, the migrations.
DEP002 = ["uvicorn", "alembic"]

[tool.vulture]
paths = ["src", "vulture_whitelist.py"]
min_confidence = 60
# Called by the frameworks by name: LangChain and LangGraph hooks, pydantic and SQLAlchemy
# configuration, the uvicorn factory.
ignore_names = [
    "model_config", "state_schema", "args_schema", "description", "type_annotation_map",
    "before_agent", "before_model", "after_model", "awrap_model_call",
    "_run", "_arun", "_generate", "_agenerate", "_astream", "_llm_type",
    "_get_ls_params", "_get_request_payload", "_get_relevant_documents",
    "_aget_relevant_documents", "embed_documents", "embed_query", "create_app",
]
ignore_decorators = [
    "@field_validator", "@model_validator", "@router.get", "@router.post", "@hook_config",
    "@property",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires running infrastructure (Postgres)",
    "llm: calls an external LLM API",
]

[tool.coverage.run]
source = ["customer_agent"]
branch = true
